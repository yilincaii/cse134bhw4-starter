<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 · Flex centering</title>
  <link rel="stylesheet" href="vars.css">
  <link rel="stylesheet" href="global.css">
  <!--
    FLEX CENTERING
    The body is a flex container filling the viewport (min-height: 100svh).
    justify-content centers its child on the main axis (horizontal here)
    and align-items centers it on the cross axis (vertical) — perfect
    centering in three lines, the problem floats never solved.
  -->
  <style>
    body {
      --card-width: 28rem;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100svh;
      padding: var(--space-3);

      main {
        max-width: var(--card-width);
        padding: var(--space-3);
        border: var(--border);
        border-block-start: var(--rule);
        background: var(--panel);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>05 · Flex centering</h1>
    <p>This card sits dead center in the viewport. The body is <code>display: flex</code> with <code>justify-content: center</code> and <code>align-items: center</code>.</p>
    <p>Resize the window — it stays centered both ways.</p>
  </main>
</body>
</html>
