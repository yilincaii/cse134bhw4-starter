<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · Absolute position</title>
  <link rel="stylesheet" href="vars.css">
  <link rel="stylesheet" href="global.css">
  <!--
    ABSOLUTE POSITION
    position: absolute removes a box from flow entirely and positions it
    against its nearest positioned ancestor — here the figure, which is
    position: relative for exactly that purpose. With no positioned
    ancestor it would measure against the viewport instead.
  -->
  <style>
    body {
      --figure-height: 12rem;

      max-width: var(--measure);
      margin-inline: auto;
      padding: var(--space-3);
    }

    figure {
      position: relative;
      min-height: var(--figure-height);
      margin-block-end: var(--space-2);
      padding: var(--space-2);
      border: var(--border);
      background: var(--panel);

      figcaption {
        position: absolute;
        top: 0;
        right: 0;
        padding: var(--space-1) var(--space-2);
        background: var(--accent);
        color: var(--paper);
      }
    }
  </style>
</head>
<body>
  <h1>04 · Absolute position</h1>
  <p>The red tag is absolutely positioned in the top-right corner of the figure.</p>

  <figure>
    <p>This figure is <code>position: relative</code>, which makes it the containing block for anything absolutely positioned inside it.</p>
    <p>The tag is out of flow: it takes up no space in this text and simply overlaps whatever sits beneath it.</p>
    <figcaption>top: 0; right: 0</figcaption>
  </figure>

  <p>Change the offsets to <code>bottom</code> and <code>left</code> and the tag pins to the opposite corner — absolute boxes are placed, not flowed.</p>
</body>
</html>
